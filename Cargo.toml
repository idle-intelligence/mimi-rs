[package]
name = "mimi-rs"
version = "0.1.0"
edition = "2024"

[features]
accelerate = ["candle-core/accelerate"]
metal = ["candle-core/metal"]
cuda = ["candle-core/cuda"]

[dependencies]
candle-core = "0.9"
candle-nn = "0.9"
half = "2"
safetensors = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
